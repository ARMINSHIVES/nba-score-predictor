[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nbapred"
version = "0.2.0"
description = "Predict NBA final scores before tip-off or from the halftime or end-of-Q3 score, with leakage-safe features and baselines."
readme = "README.md"
license = "MIT"
authors = [{ name = "Armaan Shivpuri" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
data = ["kaggle==2.2.5", "six==1.17.0"]

[project.scripts]
predict = "nbapred.cli:main"
nbapred-train = "nbapred.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
