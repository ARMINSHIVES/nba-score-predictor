[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nbapred"
version = "0.1.0"
description = "Predict NBA final scores from pre-game data, with leakage-safe features and honest baselines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Armaan Shivpuri" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
predict = "nbapred.cli:main"
nbapred-train = "nbapred.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
